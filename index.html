<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILVE SPORTS | Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .content {
            text-align: center;
            z-index: 10;
            padding: 50px 20px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        .logo {
            font-size: 2.6rem;
            font-weight: 800;
            letter-spacing: 10px;
            color: #fff;
            margin-bottom: 5px;
            text-transform: uppercase;
            position: relative;
            display: inline-block;
        }
        .tm {
            font-size: 0.8rem;
            vertical-align: super;
            letter-spacing: normal;
            margin-left: -5px;
            font-weight: 400;
            color: #888;
        }
        .tagline {
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 50px;
            font-weight: 300;
            letter-spacing: 3px;
        }
        
        .racket-container {
            display: flex;
            gap: 60px;
            justify-content: center;
            margin-bottom: 50px;
            -webkit-filter: brightness(1.2);
            filter: brightness(1.2); 
            opacity: 1;
            pointer-events: none;
        }

        .racket {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .racket-head {
            width: 60px;
            height: 80px;
            border: 3px solid #ffffff;
            border-radius: 50% 50% 48% 48%;
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.08);
        }
        .racket-head::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                repeating-linear-gradient(to right, transparent, transparent 6px, rgba(255,255,255,0.3) 8px),
                repeating-linear-gradient(to bottom, transparent, transparent 8px, rgba(255,255,255,0.3) 10px);
        }
        .racket-shaft {
            width: 3px;
            height: 60px; 
            background-color: #ffffff;
        }
        .racket-grip {
            width: 12px;
            height: 65px; 
            border-radius: 1px;
        }
        
        .glacier-grip { background: linear-gradient(to bottom, #7CFFFF, #0050D1); box-shadow: 0 0 25px rgba(124, 255, 255, 0.4); }
        .berry-grip { background: linear-gradient(to bottom, #FFB6F1, #D319AD); box-shadow: 0 0 25px rgba(255, 182, 241, 0.4); }

        h2 {
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 400;
            line-height: 1.4;
        }
        
        .info-text {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 30px;
            font-weight: 300;
        }

        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        input[type="email"] {
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #111;
            color: white;
            text-align: center;
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
        }
        button {
            padding: 18px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        
        #status {
            padding: 20px;
            border-radius: 10px;
            display: none; 
        }
        .success-box {
            border: 1px solid #5DE0E6;
            background: rgba(93, 224, 230, 0.05);
        }
        .success-title {
            color: #5DE0E6;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .success-text {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .instagram-link {
            margin-top: 40px;
            display: block;
            color: #fff;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .instagram-link:hover {
            opacity: 1;
        }

        .footer {
            margin-top: 60px;
            padding-bottom: 40px;
            font-size: 0.7rem;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 2px;
            line-height: 2;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logo">SILVE<span class="tm">™</span></div>
        <div class="tagline">PREMIUM BADMINTON GRIPS</div>
        
        <div class="racket-container">
            <div class="racket">
                <div class="racket-head"></div>
                <div class="racket-shaft"></div>
                <div class="racket-grip glacier-grip"></div>
            </div>
            <div class="racket">
                <div class="racket-head"></div>
                <div class="racket-shaft"></div>
                <div class="racket-grip berry-grip"></div>
            </div>
        </div>

        <div id="form-container">
            <h2>The finest grips are landing soon.</h2>
            <div class="info-text">Join for early access and founder's pricing.</div>
            
            <form id="my-form" class="waitlist-form">
                <input type="email" name="email" id="email-input" placeholder="Enter your email..." required>
                <button id="submit-button" type="submit">JOIN THE WAITLIST</button>
            </form>
        </div>
        
        <div id="status">
            <div class="success-title">Welcome to the club.</div>
            <div class="success-text">You're now on the waitlist. We will notify you as soon as the collection drops.</div>
        </div>

        <a href="https://instagram.com/silvesports" target="_blank" class="instagram-link">
            Follow us @silvesports
        </a>
        
        <div class="footer">
            Stockholm Edition | silvesports.se<br>
            © 2026 SILVE SPORTS™
        </div>
    </div>

    <script>
        var form = document.getElementById("my-form");
        var formContainer = document.getElementById("form-container");
        var statusBox = document.getElementById("status");
        var button = document.getElementById("submit-button");

        async function handleSubmit(event) {
          event.preventDefault();
          var data = new FormData(event.target);
          
          button.innerHTML = "SENDING...";
          button.disabled = true;

          fetch("https://formspree.io/f/xqenzone", {
            method: "POST",
            body: data,
            headers: {
                'Accept': 'application/json'
            }
          }).then(response => {
            if (response.ok) {
              formContainer.style.display = "none";
              statusBox.style.display = "block";
              statusBox.className = "success-box";
            } else {
              button.innerHTML = "ERROR - TRY AGAIN";
              button.disabled = false;
            }
          }).catch(error => {
            button.innerHTML = "CONNECTION ERROR";
            button.disabled = false;
          });
        }
        form.addEventListener("submit", handleSubmit)
    </script>
</body>
</html>
