<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILVE SPORTS | Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }
        .content {
            text-align: center;
            z-index: 10;
            padding: 80px 20px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }
        .logo {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 10px;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .tagline {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 70px;
            font-weight: 300;
            letter-spacing: 3px;
        }
        
        /* Den kompakta racket-containern */
        .racket-container {
            display: flex;
            gap: 50px;
            justify-content: center;
            margin-bottom: 60px;
            filter: blur(10px) brightness(1.1); 
            opacity: 0.7;
            pointer-events: none;
        }

        .racket {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .racket-head {
            width: 60px;
            height: 80px;
            border: 2px solid #ffffff;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            overflow: hidden;
            background: rgba(255,255,255,0.05);
        }
        /* Tydliga strängar */
        .racket-head::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: 
                repeating-linear-gradient(to right, transparent, transparent 7px, rgba(255,255,255,0.3) 8px),
                repeating-linear-gradient(to bottom, transparent, transparent 9px, rgba(255,255,255,0.3) 10px);
        }
        /* Det korta skaftet från första versionen */
        .racket-shaft {
            width: 3px;
            height: 50px; 
            background-color: #ffffff;
        }
        /* Det korta, kraftiga greppet från första versionen */
        .racket-grip {
            width: 14px;
            height: 40px; 
            border-radius: 2px;
        }
        
        .glacier-grip { background: linear-gradient(to bottom, #5DE0E6, #004AAD); box-shadow: 0 0 25px rgba(93, 224, 230, 0.3); }
        .berry-grip { background: linear-gradient(to bottom, #EB8FD6, #AD138B); box-shadow: 0 0 25px rgba(235, 143, 214, 0.3); }

        h2 {
            font-size: 1.4rem;
            margin-bottom: 35px;
            font-weight: 400;
            line-height: 1.4;
        }
        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
        }
        input[type="email"] {
            padding: 18px;
            border-radius: 10px;
            border: 1px solid #222;
            background: #111;
            color: white;
            text-align: center;
            font-size: 16px;
            outline: none;
            -webkit-appearance: none;
        }
        button {
            padding: 18px;
            border-radius: 10px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .location-tag {
            margin-top: 80px;
            padding-bottom: 40px;
            font-size: 0.7rem;
            color: #222;
            text-transform: uppercase;
            letter-spacing: 4px;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logo">SILVE</div>
        <div class="tagline">PREMIUM BADMINTON GRIPS</div>
        
        <div class="racket-container">
            <div class="racket">
                <div class="racket-head"></div>
                <div class="racket-shaft"></div>
                <div class="racket-grip glacier-grip"></div>
            </div>
            <div class="racket">
                <div class="racket-head"></div>
                <div class="racket-shaft"></div>
                <div class="racket-grip berry-grip"></div>
            </div>
        </div>

        <h2>The finest grips are landing soon. <br><strong>Want to be the first to test?</strong></h2>
        
        <form class="waitlist-form" action="DIN_FORMSPREE_URL_HÄR" method="POST">
            <input type="email" name="email" placeholder="Enter your email..." required>
            <button type="submit">JOIN THE WAITLIST</button>
        </form>
        
        <div class="location-tag">Stockholm Edition | silvesports.se</div>
    </div>
</body>
</html>
