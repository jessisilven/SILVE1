
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SILVE SPORTS | Coming Soon</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 8px;
            color: #fff;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .tagline {
            font-size: 1.2rem;
            color: #888;
            margin-bottom: 50px;
            font-weight: 300;
        }
        .preview-box {
            display: flex;
            gap: 30px;
            margin-bottom: 50px;
            filter: blur(15px);
            opacity: 0.6;
        }
        .grip-silhouette {
            width: 40px;
            height: 200px;
            border-radius: 20px;
        }
        .glacier { background: linear-gradient(to top, #004AAD, #5DE0E6, #ffffff); }
        .berry { background: linear-gradient(to top, #AD138B, #EB8FD6, #ffffff); }
        .content {
            text-align: center;
            z-index: 10;
            padding: 20px;
        }
        h2 {
            font-size: 1.5rem;
            margin-bottom: 30px;
            font-weight: 400;
            max-width: 400px;
            line-height: 1.4;
        }
        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 300px;
            margin: 0 auto;
        }
        input[type="email"] {
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #333;
            background: #111;
            color: white;
            text-align: center;
            width: 100%;
        }
        button {
            padding: 15px;
            border-radius: 5px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .location-tag {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #444;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="content">
        <div class="logo">SILVE</div>
        <div class="tagline">PREMIUM BADMINTON GRIPS</div>
        <div class="preview-box">
            <div class="grip-silhouette glacier"></div>
            <div class="grip-silhouette berry"></div>
        </div>
        <h2>Världens snyggaste grepp landar snart i Stockholm. <br><strong>Vill du testa?</strong></h2>
        <form class="waitlist-form">
            <input type="email" placeholder="Ange din e-post..." required>
            <button type="submit">JOIN THE WAITLIST</button>
        </form>
        <div class="location-tag">Stockholm Edition | silvesports.se</div>
    </div>
</body>
</html>
