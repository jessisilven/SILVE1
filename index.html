<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S I L V E™ | Premium Badminton Grips</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/twemoji@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --bg-dark: #000000;
            --card-bg: #0a0a0a;
            --text-dim: #888;
            --text-light: #eee;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            text-align: center;
            overflow-x: hidden;
        }

        img.emoji {
            height: 1.2em;
            width: 1.2em;
            margin: 0 .05em .1em .1em;
            vertical-align: -0.1em;
        }

        .container { max-width: 500px; margin: 0 auto; padding: 10px 15px; position: relative; }

        .lang-toggle {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            background: #1a1a1a;
            padding: 4px 8px;
            border-radius: 8px;
            border: 1px solid #333;
            z-index: 100;
            font-size: 0.8rem;
        }

        /* HEADER - OPTIMERAD FÖR ATT SLIPPA SCROLL */
        .header { padding: 25px 0 10px; }
        
        .main-logo { 
            font-size: clamp(2rem, 7vw, 2.8rem);
            font-weight: 900; 
            letter-spacing: 10px; 
            text-transform: uppercase; 
            margin: 0; 
            position: relative; 
            display: inline-block;
            padding-right: 5px;
        }
        
        .tm-symbol { 
            font-size: 0.5rem; 
            position: absolute;
            top: 0px; 
            right: -6px; 
            color: #ffffff;
            font-weight: 400;
            letter-spacing: normal;
        }

        .tagline-main {
            font-size: 0.65rem;
            font-weight: 400; 
            letter-spacing: 3px; 
            color: var(--text-dim); 
            text-transform: uppercase;
            display: block;
            margin: 8px 0 5px;
        }

        .tagline-sub {
            font-size: 0.55rem; 
            font-weight: 400;
            color: var(--text-dim);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* PRODUKTBILD - VISAR HELA SKAFTET + LINDOR */
        .racket-handle-container {
            width: 100%;
            margin: 5px 0 15px;
            display: flex;
            justify-content: center;
        }
        .product-image { 
            width: 100%; 
            max-height: 280px; 
            object-fit: contain; 
            display: block;
        }

        /* VÄNTELISTA - KOMPAKT */
        .waitlist-section { 
            margin: 0 0 25px; 
            background: #0a0a0a;
            padding: 15px;
            border-radius: 20px;
            border: 1px solid #151515;
        }
        
        .form-container {
            background: #111; 
            padding: 3px; 
            border-radius: 14px; 
            border: 1px solid #222; 
            display: flex;
            align-items: center;
            width: 100%;
        }
        
        .form-container input {
            flex: 1; 
            min-width: 0;
            background: transparent; 
            border: none; 
            padding: 10px; 
            color: #fff; 
            outline: none; 
            font-size: 0.8rem;
        }
        
        .form-container button {
            background: #fff; color: #000; border: none; padding: 8px 15px; border-radius: 10px; 
            font-weight: 900; cursor: pointer; font-size: 0.7rem; transition: 0.3s;
            white-space: nowrap; flex-shrink: 0;
        }

        /* EGENSKAPER */
        .features-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .feature-icon { display: block; font-size: 1.3rem; margin-bottom: 3px; }
        .feature-item h3 { font-size: 0.65rem; font-weight: 900; text-transform: uppercase; margin: 0; }
        .feature-item p { font-size: 0.6rem; color: var(--text-dim); margin-top: 3px; line-height: 1.3; }

        /* STOCKHOLM EDITION KORT */
        .edition-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            margin: 15px 0;
            text-align: left;
            border: 1px solid #151515;
            position: relative;
            overflow: hidden;
        }
        
        .stockholm-skyline {
            height: 50px;
            width: 100%;
            margin-bottom: 12px;
            background-repeat: no-repeat;
